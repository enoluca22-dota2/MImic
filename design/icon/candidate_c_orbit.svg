<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Concept C — audio orbit: five sound bars inside a tilted orbit, with a glowing satellite. -->
  <defs>
    <linearGradient id="bars" x1="54" y1="34" x2="54" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="orbit" x1="24" y1="54" x2="84" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="sat" cx="69" cy="63.5" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0FAFF"/>
      <stop offset="0.35" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-24 54 54)">
    <path d="M23,54 A31,11.5 0 0 1 85,54" fill="none" stroke="url(#orbit)" stroke-opacity="0.45" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <g stroke="url(#bars)" stroke-width="5.6" stroke-linecap="round">
    <path d="M38,48 L38,60"/>
    <path d="M46,40 L46,68"/>
    <path d="M54,34 L54,74"/>
    <path d="M62,40 L62,68"/>
    <path d="M70,48 L70,60"/>
  </g>
  <g transform="rotate(-24 54 54)">
    <path d="M85,54 A31,11.5 0 0 1 23,54" fill="none" stroke="url(#orbit)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="69" cy="63.5" r="7" fill="url(#sat)"/>
    <circle cx="69" cy="63.5" r="2.6" fill="#F0FDFF"/>
  </g>
</svg>
