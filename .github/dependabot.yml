# Dependabot: weekly update PRs for Gradle libraries and GitHub Actions (security updates are also
# enabled in the repository settings). Every PR runs CI + the security workflow before merging.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-build:
        patterns: ["org.jetbrains.kotlin*", "com.android.*", "com.google.devtools.ksp*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
