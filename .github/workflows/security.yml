# MImic security gate — secrets, vulnerable dependencies, manifest/release policy, security tests.
# Runs on every pull request, on pushes to main, weekly (new advisories appear without code
# changes) and on demand. It needs no secrets and no paid service; pull requests from forks run
# with a read-only token and never see signing material (releases are signed only on the
# maintainer's PC — see docs/RELEASING.md). Static analysis is in codeql.yml.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (Gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Scan every commit
        run: ./gitleaks git . --redact --no-banner --config .gitleaks.toml --log-opts="--all" --report-format json --report-path gitleaks.json
      - name: Upload (redacted) report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks
          path: gitleaks.json
          retention-days: 14

  dependencies:
    name: Vulnerable dependencies (OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Resolve release dependencies
        run: |
          ./gradlew --no-daemon -q :app:dependencies --configuration fullReleaseRuntimeClasspath > deps-full.txt
          ./gradlew --no-daemon -q :app:dependencies --configuration standardReleaseRuntimeClasspath > deps-standard.txt
      - name: Check against osv.dev (blocks on unreviewed HIGH/CRITICAL)
        run: python3 -I scripts/security/osv_gradle.py deps-full.txt deps-standard.txt --allow scripts/security/osv-allowlist.txt --json osv.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: osv
          path: |
            osv.json
            deps-full.txt
            deps-standard.txt
          retention-days: 30

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  android-policy:
    name: Manifest, release configuration and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: No signing material or secrets tracked in git
        run: |
          bad=$(git ls-files | grep -Ei '[.](jks|keystore|p12|pem)$|(^|/)(keystore|firebase|cloud)[.]properties$|google-services[.]json$|(^|/)[.]env$' || true)
          if [ -n "$bad" ]; then echo "::error::Sensitive files are tracked: $bad"; exit 1; fi
      - name: Release identity is unchanged
        run: |
          grep -qF 'applicationId = "com.example.mimic"' app/build.gradle.kts || { echo "::error::applicationId changed"; exit 1; }
          grep -qF 'C03C51075A49A049387185C775626074368AA9F4220EB5BA0E74CC4A4F88087D' app/build.gradle.kts || { echo "::error::pinned release certificate changed"; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Security regression tests (both editions)
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :app:testStandardDebugUnitTest --tests '*SecurityRegressionTest' --tests '*UpdateLogicTest'
      - name: Merged release manifests
        run: ./gradlew --no-daemon :app:processFullReleaseMainManifest :app:processStandardReleaseMainManifest
      - name: Check merged manifests
        run: |
          for v in fullRelease standardRelease; do
            m=$(find app/build/intermediates -path "*merged_manifest*/$v/*" -name AndroidManifest.xml | head -1)
            echo "== $v: $m"
            python3 -I scripts/security/check_manifest.py "$m" --json "manifest-$v.json"
          done
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-policy
          path: manifest-*.json
          retention-days: 30

  report:
    name: Security report
    if: always()
    needs: [secrets, dependencies, android-policy]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "## MImic security gate"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Secret scan (full history) | ${{ needs.secrets.result }} |"
            echo "| Vulnerable dependencies | ${{ needs.dependencies.result }} |"
            echo "| Manifest / release policy / security tests | ${{ needs.android-policy.result }} |"
            echo
            echo "Details: the job artifacts (gitleaks, osv, android-policy). Static analysis: CodeQL."
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.secrets.result }}" = success ] && [ "${{ needs.dependencies.result }}" = success ] && [ "${{ needs.android-policy.result }}" = success ]
