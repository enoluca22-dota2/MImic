# MImic CI — every push and pull request: unit tests for both editions, lint, and a debug build.
# Third-party actions are pinned to reviewed commits (Dependabot proposes updates). Security scans
# live in security.yml and codeql.yml.
#
# Publishing is NOT done here: releases are signed on the maintainer's machine (the signing key
# never leaves it) and published with scripts/release.sh --publish after these checks pass.
# See docs/RELEASING.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Version sanity
        run: |
          VERSION=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          echo "versionName = $VERSION"
          grep -q "^## $VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' section"; exit 1; }

      - name: Unit tests (full + standard)
        run: ./gradlew --no-daemon :app:testFullDebugUnitTest :app:testStandardDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintFullDebug

      - name: Debug build (unsigned by any release key)
        run: ./gradlew --no-daemon :app:assembleStandardDebug

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: app/build/reports/
          retention-days: 7
